services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      # Do not leave this on 0.0.0.0 in production. Bind a management address:
      # - "10.40.8.10:8443:8443"
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - web

  web:
    build:
      context: ./web
    expose:
      - "8080"
    restart: unless-stopped

  app:
    build: .
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/sbce_manager.db
      - SECRET_KEY=change-me-in-production
      - ENCRYPTION_KEY=change-me-in-production-32bytes!!
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
