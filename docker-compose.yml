services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - web

  web:
    build:
      context: ./web
    expose:
      - "8080"
      - "8081"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_REDIRECT_URI: ${ENTRA_REDIRECT_URI:-}
      ENTRA_ALLOWED_DOMAIN: ${ENTRA_ALLOWED_DOMAIN:-yourdomain.com}
      CUSTOMER_MODE: ${CUSTOMER_MODE:-multiple}
      CUSTOMER_NAME: ${CUSTOMER_NAME:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
    restart: unless-stopped

  app:
    profiles: ["api"]
    build: .
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
    environment:
      DATABASE_URL: sqlite:////app/data/sbce_manager.db
      SECRET_KEY: ${SECRET_KEY:-change-me}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-me-in-production-32bytes!!}
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
